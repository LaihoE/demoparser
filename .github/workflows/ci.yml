name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test Parser Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/parser
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build in src/parser directory
        run: cargo test --release

  test_python_bindings:
    name: Test Python Bindings
    # ubuntu-latest is now 26.04, for which actions/setup-python has no
    # Python 3.8 or 3.9 builds. 24.04 has builds for every version below.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: src/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Print commit hash
        run: git rev-parse HEAD

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run signature test
        working-directory: ./src/python
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install maturin patchelf mypy pandas-stubs

          maturin develop
          python3 tests/signature_tests.py
          python3 -m mypy.stubtest demoparser2 --allowlist tests/mypy-stubtest-allowlist.txt
